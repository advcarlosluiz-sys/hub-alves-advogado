<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo | Carlos Luiz Alves Advocacia</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --bg-main: #f8f9fa;
            --bg-alt: #ffffff;
            --bg-dark: #0a192f;
            --bg-darker: #060f1d;
            --primary: #0a192f;
            --primary-light: #162a4d;
            --secondary: #bfa15f;
            --secondary-dark: #9c8248;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --text-light: #f1f5f9;
            --border-light: rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-darker);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-dark);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .login-header {
            margin-bottom: 2.5rem;
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--secondary);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            color: #fff;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: var(--secondary);
            color: var(--primary);
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: var(--secondary-dark);
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            margin-top: 1rem;
            color: #ff6b6b;
            font-size: 0.9rem;
            min-height: 20px;
            text-align: center;
        }

        .back-link {
            margin-top: 2rem;
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--secondary);
        }
        
        .alert-badge {
            background: rgba(191, 161, 95, 0.1);
            color: var(--secondary);
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <span class="alert-badge">Acesso Restrito</span>
        <div class="login-header">
            <h1>Painel Administrativo</h1>
            <p>Carlos Luiz Alves Advocacia</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail Administrativo</label>
                <input type="email" id="email" required placeholder="exemplo@advcarlosluiz.com.br" value="advcarlosluiz@gmail.com">
            </div>
            <div class="form-group">
                <label for="password">Senha de Acesso</label>
                <input type="password" id="password" required placeholder="Digite sua senha">
            </div>
            
            <button type="submit" class="btn-submit" id="btn-login">Entrar</button>
            <p class="error-message" id="error-message"></p>
        </form>

        <a href="/" class="back-link">➔ Voltar para o Site Principal</a>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('error-message');

            errorMsg.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Autenticando...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Salvar o token no localStorage também (como contingência para o cookie HTTP Only)
                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('admin_user', JSON.stringify(data.user));
                    window.location.href = '/admin/index.html';
                } else {
                    errorMsg.textContent = data.message || 'Erro ao realizar login.';
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = 'Erro de conexão com o servidor.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
